<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniQuip Data Scraper</title>
    <!-- Bootstrap CSS untuk tampilan cepat -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table-responsive { max-height: 500px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4" style="color: #007bff;">UniQuip Scraper Dashboard</h3>
                    
                    <!-- Form Login untuk Scraper -->
                    <div class="row mb-3">
                        <div class="col-md-5">
                            <input type="text" id="username" class="form-control" placeholder="Username">
                        </div>
                        <div class="col-md-5">
                            <input type="password" id="password" class="form-control" placeholder="Password">
                        </div>
                        <div class="col-md-2">
                            <button onclick="mulaiScrape()" id="btnScrape" class="btn btn-primary w-100">Scrape</button>
                        </div>
                    </div>

                    <!-- Status Loading -->
                    <div id="loading" class="text-center d-none">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">Sedang mengambil data dari sistem UniQuip (Proses ini butuh waktu 1-2 menit)...</p>
                    </div>

                    <!-- Alert Error -->
                    <div id="errorAlert" class="alert alert-danger d-none"></div>

                    <!-- Tabel Hasil -->
                    <div id="hasilContainer" class="d-none">
                        <h5>Hasil Scraping (<span id="totalData">0</span> baris ditemukan)</h5>
                        <div class="table-responsive mt-3">
                            <table class="table table-bordered table-striped table-hover">
                                <thead class="table-dark">
                                    <tr id="tableHeader">
                                        <!-- Header di-generate oleh Javascript -->
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <!-- Body di-generate oleh Javascript -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function mulaiScrape() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const btn = document.getElementById('btnScrape');
    const loading = document.getElementById('loading');
    const alertError = document.getElementById('errorAlert');
    const hasilContainer = document.getElementById('hasilContainer');

    // Reset UI
    alertError.classList.add('d-none');
    hasilContainer.classList.add('d-none');
    loading.classList.remove('d-none');
    btn.disabled = true;

    try {
        const response = await fetch('/api/scrape', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        });

        const result = await response.json();

        if (!response.ok) throw new Error(result.error || "Terjadi kesalahan");

        // Tampilkan Tabel
        document.getElementById('totalData').innerText = result.total_data;
        
        // Buat Header Tabel
        const headerRow = document.getElementById('tableHeader');
        headerRow.innerHTML = '';
        const keys = Object.keys(result.data[0]);
        keys.forEach(key => {
            headerRow.innerHTML += `<th>${key}</th>`;
        });

        // Buat Body Tabel
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        result.data.forEach(row => {
            let tr = '<tr>';
            keys.forEach(key => {
                tr += `<td>${row[key]}</td>`;
            });
            tr += '</tr>';
            tbody.innerHTML += tr;
        });

        hasilContainer.classList.remove('d-none');

    } catch (error) {
        alertError.innerText = error.message;
        alertError.classList.remove('d-none');
    } finally {
        loading.classList.add('d-none');
        btn.disabled = false;
    }
}
</script>

</body>
</html>
